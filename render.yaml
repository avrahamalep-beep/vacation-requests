# https://render.com/docs/blueprint-spec
# Connect the Git repo in Render → New → Blueprint, or add a Web Service with the same build/start.
# Set DATABASE_URL in the dashboard to your Neon connection string. Run server/neon-install.sql on Neon if needed.
# Uploads under server/uploads/ are ephemeral unless you add a Render Disk and point uploads there.

services:
  - type: web
    name: restapp
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
